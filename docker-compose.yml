version: "3.9"

services:
  nextchat-custom:
    container_name: jt-web-kt
    build: . 
    ports:
      - "3000:3000"
    environment:
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - CODE=$CODE
      - BASE_URL=$BASE_URL
      - DATA_DIR=/app/data
      - NEXT_PUBLIC_BACKEND_URL=$NEXT_PUBLIC_BACKEND_URL 
    
    volumes:
      # 原本的数据固化
      - nextchat_db_data:/app/data
      
      # 🌟 核心新增 1：挂载 Docker Socket，让容器有权限执行 docker 命令
      - /var/run/docker.sock:/var/run/docker.sock
      
      # 🌟 核心新增 2：把宿主机的脚本目录原封不动挂载进容器
      # 这样前端代码里写的绝对路径 `/home/ljb/scripts/sglang/docker_switch.sh` 就能直接命中！
      - /home/ljb/scripts/sglang:/home/ljb/scripts/sglang
      
    restart: always

volumes:
  nextchat_db_data: